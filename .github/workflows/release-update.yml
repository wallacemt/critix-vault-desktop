name: CD Release Update

on:
    workflow_dispatch:
        inputs:
            tag:
                # Options list is maintained automatically by cd.yml after each release.
                description: "Release para atualizar"
                required: true
                type: choice
                options:
                    - v2.0.0

permissions:
    contents: write

concurrency:
    group: release-update-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    build:
        name: Build - ${{ matrix.label }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-latest
                      label: Windows
                      bundles: nsis,msi

                    - platform: ubuntu-22.04
                      label: Linux
                      bundles: appimage,deb

                    - platform: macos-latest
                      label: macOS
                      bundles: dmg

        runs-on: ${{ matrix.platform }}
        timeout-minutes: 70

        env:
            CI: true
            BACKEND_URL: ${{ secrets['BACKEND_URL'] }}
            NEXT_PUBLIC_CRITIX_API_URL: ${{ secrets['BACKEND_URL'] }}
            CRITIX_EXTERNAL_API_URL: ${{ secrets['BACKEND_URL'] }}
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets['TAURI_SIGNING_PRIVATE_KEY'] }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets['TAURI_SIGNING_PRIVATE_KEY_PASSWORD'] }}

        steps:
            - name: Validate tag exists
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1 || {
                    echo "::error::Release '${{ inputs.tag }}' not found. Create the release first."
                    exit 1
                  }

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Validate required secrets
              shell: bash
              run: |
                  if [ -z "$BACKEND_URL" ]; then
                    echo "::error::BACKEND_URL secret is required."
                    exit 1
                  fi
                  if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
                    echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required."
                    exit 1
                  fi
                  if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
                    echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is required."
                    exit 1
                  fi

            - name: Install Linux build dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libfuse2 \
                    libgstreamer1.0-0 \
                    libgstreamer-plugins-base1.0-0 \
                    gstreamer1.0-tools \
                    gstreamer1.0-plugins-base \
                    gstreamer1.0-plugins-good \
                    gstreamer1.0-plugins-bad \
                    gstreamer1.0-plugins-ugly \
                    gstreamer1.0-libav \
                    gstreamer1.0-pulseaudio

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Prisma client
              run: bunx prisma generate

            - name: Build desktop app (Tauri)
              env:
                  APPIMAGE_EXTRACT_AND_RUN: 1
                  NO_STRIP: true
                  RUST_BACKTRACE: 1
              run: bun run tauri:build -- --verbose --bundles ${{ matrix.bundles }}

            - name: Upload artifacts to existing release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  TAG="${{ inputs.tag }}"
                  BUNDLE_DIR="src-tauri/target/release/bundle"
                  UPLOADED=0

                  for file in \
                    "$BUNDLE_DIR"/nsis/*.exe \
                    "$BUNDLE_DIR"/msi/*.msi \
                    "$BUNDLE_DIR"/appimage/*.AppImage \
                    "$BUNDLE_DIR"/deb/*.deb \
                    "$BUNDLE_DIR"/dmg/*.dmg; do
                    if [ -f "$file" ]; then
                      echo "Uploading: $file"
                      gh release upload "$TAG" "$file" \
                        --repo "${{ github.repository }}" \
                        --clobber
                      UPLOADED=$((UPLOADED + 1))
                    fi
                  done

                  if [ "$UPLOADED" -eq 0 ]; then
                    echo "::warning::No release artifacts found for ${{ matrix.label }}"
                  else
                    echo "Uploaded $UPLOADED artifact(s) for ${{ matrix.label }}"
                  fi
